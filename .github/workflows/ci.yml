name: CI

on:
  push:
    branches: [go-rewrite]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          check-latest: true
      - name: Verify generated command metadata
        run: |
          go run ./tools/codegen
          git diff --exit-code -- internal/cmd/generated/zz_generated_commands.go
      - name: Lint formatting
        run: test -z "$(gofmt -l cmd internal tools)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Check spec-to-command contract
        run: go run ./tools/contractcheck
