              ],
              "description": "To allow filtering sessions list by comma separated video qualities"
            }
          },
          {
            "in": "query",
            "name": "reason",
            "schema": {
              "type": "string",
              "description": "To allow searching sessions list by reason"
            }
          },
          {
            "in": "query",
            "name": "created_by",
            "schema": {
              "type": "string",
              "description": "To allow filtering sessions list by created by"
            }
          },
          {
            "in": "query",
            "name": "device_name",
            "schema": {
              "type": "string",
              "description": "To allow searching sessions list by device name"
            }
          },
          {
            "in": "query",
            "name": "ordering",
            "schema": {
              "type": "string",
              "default": "-created_at",
              "enum": [
                "created_at",
                "updated_at",
                "device_name",
                "duration",
                "state",
                "reason",
                "video_quality",
                "created_by"
              ],
              "description": "To allow ordering sessions list by created_at, updated_at, device_name, duration, state, reason, video_quality and created_by."
            }
          },
          {
            "in": "query",
            "name": "duration_lt",
            "schema": {
              "type": "string",
              "format": "duration",
              "description": "Duration less than filter. The time duration (in ISO 8601 duration format) of only a valid elapsed session, i.e., sessions that have moved from ACTIVE state (where session start-time can be captured) to TERMINATED or FAILED state (where the session end-time can be captured).",
