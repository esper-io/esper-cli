              "example": "duration_lte=PT10M30S"
            }
          },
          {
            "in": "query",
            "name": "duration_gt",
            "schema": {
              "type": "string",
              "format": "duration",
              "description": "Duration greater than filter. The time duration (in ISO 8601 duration format) of only a valid elapsed session, i.e., sessions that have moved from ACTIVE state (where session start-time can be captured) to TERMINATED or FAILED state (where the session end-time can be captured).",
              "example": "duration_gt=PT10M30S"
            }
          },
          {
            "in": "query",
            "name": "duration_gte",
            "schema": {
              "type": "string",
              "format": "duration",
              "description": "Duration greater than or equal to filter. The time duration (in ISO 8601 duration format) of only a valid elapsed session, i.e., sessions that have moved from ACTIVE state (where session start-time can be captured) to TERMINATED or FAILED state (where the session end-time can be captured).",
              "example": "duration_gte=PT10M30S"
            }
          },
          {
            "in": "query",
            "name": "created_at_lt",
            "schema": {
              "type": "string",
              "format": "date-time",
              "description": "Created at less than filter. Datetime format must be in \"YY-MM-DDTHH:mm:ss.fffffffffZ\".",
