          }
        ],
        "summary": "Get OEM Config Schema",
        "description": "Retrieve the OEM config schema for a given OEM type and package name.\nReturns the latest active schema by default. Specify `version_code` to retrieve a specific version.\nSet `include_schema=false` to receive metadata only (avoids the large `schema_json` payload).\n",
        "operationId": "getOEMConfigSchema",
        "tags": [
          "apps_management_OEM Config Schema"
        ],
        "parameters": [
          {
            "in": "header",
            "required": true,
            "name": "Authorization",
            "schema": {
              "type": "string"
            },
            "description": "Bearer token for authentication"
          },
          {
            "in": "query",
            "required": true,
            "name": "oem_type",
            "schema": {
              "type": "string",
              "enum": [
                "ZEBRA",
                "HONEYWELL",
                "DATALOGIC",
                "SAMSUNG",
                "SUNMI"
              ]
            },
            "description": "OEM manufacturer type",
            "example": "ZEBRA"
          },
          {
            "in": "query",
            "required": true,
            "name": "package_name",
            "schema": {
              "type": "string"
            },
            "description": "OEM config package name (e.g. com.zebra.oemconfig.common)",
            "example": "com.zebra.oemconfig.common"
          },
          {
            "in": "query",
            "required": false,
            "name": "version_code",
            "schema": {
              "type": "string"
            },
            "description": "Specific version code to retrieve. When omitted, returns the latest active schema.",
            "example": "10"
          },
          {
            "in": "query",
            "required": false,
            "name": "include_schema",
            "schema": {
              "type": "boolean",
              "default": true
            },
            "description": "Set to false to return metadata only, omitting the schema_json field (avoids large payload)"
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string"
                },
                "description": "When version_code is specified: public, max-age=3600 (response is immutable for that version). When version_code is omitted (latest lookup): not immutable — a newer upload can change the result; do not apply long-lived public caching."
