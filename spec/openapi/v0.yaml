        "description": "Following Schedule types are supported\n\n```\n* IMMEDIATE: Schedule the command to execcute Immediately\n* WINDOW: Schedule the command to execute within the given window\n* RECURRING: Schedule the command to execute during the scheduled time until it succeeds or expires. After executing successfully, it will not fire again.\n```\n",
        "enum": [
          "IMMEDIATE",
          "WINDOW",
          "RECURRING"
        ]
      },
