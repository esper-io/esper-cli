      "DeviceCommandEnum": {
        "type": "string",
        "description": "Following commands are supported\n```\n* ADD_TO_WHITELIST: Whitelist an installed sytem app. Requires `package_name` in command arguments where `package_name` is the app package uploaded on Esper\n* ADD_WIFI_AP : Add wifi access points for device. Requires `wifi_access_points` in command arguments where `wifi_access_points` is the data with access points\n* APPLY_APP_CONFIG : Apply app configuration for an installed app.\n* CLEAR_APP_DATA : Clear data for an installed app. Requires `package_name` in command arguments where `package_name` is the app package uploaded on Esper\n* CONVERGE: Converge command for Blueprint\n* INSTALL: Install an app on a device. Requires `app_version` in command arguments where `app_version` is the version id of app uploaded on Esper\n* INSTALL_CERTIFICATE: Install a certificate chain in the system keystore of an android device. Requires `cert_file_type`, `cert_data_base64`, `cert_alias_name` and `cert_storage_type` in command arguments where `cert_file_type` must be set to \"pkcs12\", `cert_data_base64` contains the base64 encoded content of the pkcs12 file, `cert_alias_name` is the alias name with which the certificate chain is supposed to be installed and `cert_storage_type` must be set to \"system\". If the pkcs12 file is password protected, the password should be specified in the optional parameter `cert_password`.\n* LOCK: Lock device screen, Supports Android, iOS and Windows devices.\n* REBOOT: Reboot a device. Supports Android, iOS, and Windows devices.\n* REMOVE_FROM_WHITELIST : Remove an installed system app from whitelist. Requires `package_name` in command arguments where `package_name` is the app package uploaded on Esper\n* REMOVE_WIFI_AP : Remove Wifi access points for device. Requires `wifi_access_points` in command arguments where `wifi_access_points` is the data with access points\n* SET_APP_PERMISSION : Set permission for an installed app. Requires `package_name`, `grant_state`, `permission` in command arguments where `package_name` is the app package uploaded on Esper, `grant_state` should be \"PERMISSION_GRANT_STATE_DEFAULT\", \"PERMISSION_GRANT_STATE_DENIED\", \"PERMISSION_GRANT_STATE_GRANTED\" and `permission` is a valid permission\n* SET_APP_STATE : Set the state of an app - SHOW/HIDE/DISABLE/LAUNCHABLE_BUT_HIDDEN. Requries `app_state` and `package_name` in command arguments where `app_state` is the state of app and `package_name` is the app package uploaded on Esper For LAUNCHABLE_BUT_HIDDEN: Hide an app on the home screen but allow it to be launched from other apps. Requires Esper agent 8.5+ and `package_name`. \n* SET_BLUETOOTH_STATE : Set bluetooth state (ON/OFF) for device. Requires `bluetooth_state` in command arguments where `bluetooth_state` is a boolean.\n* SET_BRIGHTNESS_SCALE : Set brightness for device. Requires `brightness_value` in command arguments where `brightness_value` is an integer (1-100).\n* SET_DEVICE_LOCKDOWN_STATE : Set lockdown state for a device. Requires `state` and `message` in command arguments where `state` is LOCKED/UNLOCKED and `message` is the message to be added with command\n* SET_GPS_STATE :Set the GPS state for a device. Requires `gps_state` in command arguments where `gps_state` should be either 0, 1, 2, 3 or 4 (LOCATION_MODE_HIGH_ACCURACY = 0, LOCATION_MODE_SENSORS_ONLY = 1, LOCATION_MODE_BATTERY_SAVING = 2, LOCATION_MODE_OFF = 3, LOCATION_MODE_ON = 4)\n* SET_KIOSK_APP : Command to set the Kiosk app for a device. Requires `package_name` in command arguments where `package_name` is the app package uploaded on Esper\n\n* SET_MULTI_APP_MODE : Command to set the device back to multi app mode.\n* SET_NEW_POLICY : Apply policy on device. Requires `policy_url` in command arguments where `policy_url` is the URL to the policy\n* SET_ROTATION_STATE : Set screen orientation. Requires `rotate_state` in command arguments where `rotate_state` should be either 0, 1 or 2 (0 = AUTO, 1 = PORTRAIT_ONLY, 2 = LANDSCAPE_ONLY)\n* SET_SCREEN_OFF_TIMEOUT: Set screen off timeout for a device. Requires `screen_off_timeout` in command arguments where `screen_off_timeout` should be either -1 or between 5000 and 1800000\n* SET_STREAM_VOLUME : Set strema volume for a device. Requires `stream` and `volume_level` in command arguments where `stream` should be either 0(Ring), 1(Notification), 2(Alarm) or 3(Music) and `volume_level` should be a value from 0 to 100\n* SET_TIMEZONE : Set the timezone for a device. Requires `timezone_string` in command arguments where `timezone_string` is a valid string representing the timezone\n* SET_WIFI_STATE : Set the wifi state (ON/OFF) for a device. Requires `wifi_state` in command arguments where `wifi_state` is a boolean.\n* UNINSTALL: Uninstall an app from device. Requires `package_name` in command arguments where `package_name` is the app package uploaded on Esper\n* UNINSTALL_CERTIFICATE: Uninstall a certificate from an android device's system keystore using the installed certificate's alias name. Requires `cert_alias_name` and `cert_storage_type` in command arguments where `cert_alias_name` is the alias name of the certificate to be uninstalled and `cert_storage_type` must be set to \"system\"\n* UPDATE_DEVICE_CONFIG: Push additional configurations to the Device\n* UPDATE_HEARTBEAT: Ping a device\n* UPDATE_LATEST_DPC : Prompt device to update the DPC app to the latest versions.\n* WIPE : Wipes the device.\n* RESET_LOCKSCREEN_PASSWORD: Change the lockscreen password of the device. Requires `new_lockscreen_password` in command arguments where `new_lockscreen_password` is a valid string.\n* UPDATE_BLUEPRINT: Pushes or reapplies the most current Blueprint version to the device or group.\n* NOTIFY_DEVICE: Allows you to  broadcast message to the device.\n* SET_DEVICE_LANGUAGE: Set language for a device. Requires locale value in xx[_Zzzz]_yy where xx is language code, Zzzz is script (optional) and yy is country code.\n* SET_ETHERNET_SETTINGS: Set ethernet settings on supported Device\n* SET_STATIC_IP: Set static ip on the deivce. Requires interface, dhcp_dnabled, static_ip, primary_dns, subnet_mask, gateway, secondary_dns (optional)\n* BEEP_DEVICE: Allows you to make the device beep for a specified duration\n* SET_APP_NOTIFICATIONS: Enable/disable app notifications. Requries `app_notifications_state` and `package_name` in command arguments where `app_notifications_state` is a string that has the value `ENABLED` or `DISABLED` and `package_name` is the app package uploaded on Esper.\n* USE_ONLY_SAVED_WIFI_AP: Allow/disallow device to connect to unregistered WiFi APs. Requires boolean `use_only_saved_ap`..\n* DEVICE_INFORMATION: Prompt device to update the device information\n* VPP_APP_INSTALL: Install a vpp app on an iOS device. Requires `app_id` and `bundle_identifier` in command arguments that corresponds to the associate vpp app\n* APPLE_APP_UNINSTALL: Uninstall an app on an iOS device. Requires `app_id` and `bundle_identifier` in command arguments that corresponds to the associated app\n* CLEAR_PASSCODE: Clear the passcode in a device\n* LIST_INSTALLED_PROFILES: Returns a list of all installed profiles on an iOS device.\n* INSTALL_PROFILE: Install a profile on an iOS device.\n* REMOVE_PROFILE: Remove a profile from an iOS device.\n* RUN_SHELL_SCRIPT: Run a shell script on a Linux or Windows device. Requires `script` and `interpreter` in command arguments.\n* RUN_CUSTOM_ACTION: Run a custom action (script) on a Linux device. Requires custom action parameters in command arguments.\n* COLLECT_LOGS: Collect and upload Esper agent logs from a Linux device.\n```\n",
        "enum": [
          "ADD_TO_WHITELIST",
          "ADD_WIFI_AP",
          "APPLY_APP_CONFIG",
          "CLEAR_APP_DATA",
          "CONVERGE",
          "INSTALL",
          "INSTALL_CERTIFICATE",
          "LIST_INSTALLED_PROFILES",
          "LOCK",
          "REBOOT",
          "REMOVE_FROM_WHITELIST",
          "REMOVE_PROFILE",
          "REMOVE_WIFI_AP",
          "SET_APP_PERMISSION",
          "SET_APP_STATE",
          "SET_BLUETOOTH_STATE",
          "SET_BRIGHTNESS_SCALE",
          "SET_DEVICE_LOCKDOWN_STATE",
          "SET_GPS_STATE",
          "SET_KIOSK_APP",
          "SET_MULTI_APP_MODE",
          "SET_NEW_POLICY",
          "SET_ROTATION_STATE",
          "SET_SCREEN_OFF_TIMEOUT",
          "SET_STREAM_VOLUME",
          "SET_TIMEZONE",
          "SET_WIFI_STATE",
          "UNINSTALL",
          "UNINSTALL_CERTIFICATE",
          "UPDATE_DEVICE_CONFIG",
          "UPDATE_HEARTBEAT",
          "UPDATE_LATEST_DPC",
          "WIPE",
          "RESET_LOCKSCREEN_PASSWORD",
          "UPDATE_BLUEPRINT",
          "NOTIFY_DEVICE",
          "SET_DEVICE_LANGUAGE",
          "SET_ETHERNET_SETTINGS",
          "SET_STATIC_IP",
          "BEEP_DEVICE",
          "SET_APP_NOTIFICATIONS",
          "USE_ONLY_SAVED_WIFI_AP",
          "DEVICE_INFORMATION",
          "VPP_APP_INSTALL",
          "APPLE_APP_UNINSTALL",
          "CLEAR_PASSCODE",
          "INSTALL_PROFILE",
          "RUN_SHELL_SCRIPT",
          "RUN_CUSTOM_ACTION",
          "COLLECT_LOGS"
        ]
      },
      "CommandRequest": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "description": "Unique command request identifier",
            "format": "uuid",
            "readOnly": true
          },
          "command_type": {
            "type": "string",
            "description": "Identifies the type of command\n\n```\n* DEVICE: command request is meant for devices\n* GROUP: command request is meant for groups\n* DYNAMIC: command request is meant for dynamic set of devices\n  i.e subset of devices from different groups or otherwise.\n```\n",
            "enum": [
              "DEVICE",
              "GROUP",
              "DYNAMIC"
            ]
          },
          "devices": {
            "maxItems": 1000,
            "minItems": 0,
            "type": "array",
            "description": "list of devices to run commands",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "groups": {
            "maxItems": 500,
            "minItems": 0,
            "type": "array",
            "description": "list of groups to run commands",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "device_type": {
            "type": "string",
            "description": "Filtering by device_type is not supported currently and applies to 'all' devices. If 'active' or 'inactive' is specified, it will be ignored.",
            "default": "active",
            "enum": [
              "active",
              "inactive",
              "all"
            ]
          },
          "command": {
            "$ref": "#/components/schemas/DeviceCommandEnum"
          },
          "command_args": {
            "$ref": "#/components/schemas/CommandArgs"
          },
          "schedule": {
            "$ref": "#/components/schemas/CommandScheduleEnum"
          },
          "schedule_args": {
            "$ref": "#/components/schemas/CommandScheduleArgs"
          },
          "reason": {
            "type": "string",
            "description": "details briefing the reason for current command request processing stage"
          },
          "created_by": {
            "type": "string",
            "description": "user id of the user",
            "readOnly": true
          },
          "created_at": {
            "type": "string",
            "description": "Timestamp of command request",
            "format": "date-time",
            "readOnly": true
          }
        }
      },
