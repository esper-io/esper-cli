        "name": "directory_record_id",
        "description": "Directory record ID",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "EnterpriseID": {
        "name": "enterprise_id",
        "description": "Enterprise ID",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
