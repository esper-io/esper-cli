  "paths": {
    "/v1/foundry/builds/": {
      "get": {
        "summary": "Get Foundry builds",
        "description": "Returns a list of all specified builds.",
        "security": [
          {
            "AuthToken": []
          }
        ],
        "operationId": "getFoundryBuilds",
        "tags": [
          "9_FoundryBuilds"
        ],
        "parameters": [
          {
            "in": "query",
            "name": "foundation_major_number",
            "description": "Filter by Esper Foundation Major Number, Foundation Numbers are integers starting at 1.",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "build_arch",
            "description": "Filter by build architecture name, build architectures {arm, arm64, x86_64, x86}",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "android_major_version",
            "description": "Filter by Android Major Version, Android Major Versions are integers starting at 1 and going to Current Android Release",
            "schema": {
              "type": "integer"
            }
          },
          {
            "in": "query",
            "name": "device_model_id",
            "description": "Device model id",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "in": "query",
            "name": "approved",
            "description": "Filter builds which have been approved for OTA update",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "in": "query",
            "name": "limit",
            "schema": {
              "type": "integer"
            }
          },
          {
            "in": "query",
            "name": "offset",
            "schema": {
              "type": "integer"
            }
          },
          {
            "in": "query",
            "name": "ordering",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "locked",
            "description": "Filter the locked builds. To be used with build_fingerprint_hash and device_model_id",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "in": "query",
            "name": "build_fingerprint_hash",
            "description": "hash of the build fingerprint of the existing build",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "List of Foundry builds",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "integer",
                      "description": "returned response code"
                    },
                    "content": {
                      "properties": {
                        "count": {
                          "type": "integer",
                          "description": "counter of number of builds retrieved"
                        },
                        "next": {
                          "type": "string",
                          "format": "url",
                          "description": "url of the next ten builds"
                        },
                        "previous": {
                          "type": "string",
                          "format": "url",
                          "description": "url of the previous ten builds"
                        },
                        "results": {
                          "items": {
                            "$ref": "#/components/schemas/Build_V1"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error_401_Unauthorized"
                }
              }
            }
          },
          "500": {
            "description": "Internal server error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error_500_Internal_Server_Error"
                }
              }
            }
          }
        },
        "x-esper-destructive": false,
        "x-esper-pagination": "limit-offset",
        "x-esper-verb": "list",
        "x-esper-noun": "foundry-build"
      }
    },
